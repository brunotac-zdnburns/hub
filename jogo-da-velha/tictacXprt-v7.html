<!DOCTYPE html>
<html lang="pt-BR">

<!--
Revisar todo o código de modo a simplificar as funções, considerando o registro e passagem das jogadas como string ao invés de vetores. 
Usar vetores apenas para avaliação das jogadas e fim de jogo, mas não usar vetores como parâmetros de funções.
Usar sempre a função de carregamento dos vetores a partir da string recebida.
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha Pro - IA Especial</title>
  <style>


	:root{
		--bg-color:#0f172a;
		--card-bg:#1e293b;
		--text-color:#f8fafc;
		--primary-color:#38bdf8;
		--secondary-color:#f97316;
		--accent-color:#22c55e;
		--border-color:#334155;
		--hover-color:#475569;
		--disabled-color:#94a3b8;
	}

	/* ==========================
	   GERAL
	========================== */

	*{
		box-sizing:border-box;
		margin:0;
		padding:0;
		font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
	}

	body{
		background:var(--bg-color);
		color:var(--text-color);
		min-height:100vh;
		display:flex;
		justify-content:center;
		align-items:center;
		padding:20px;
	}

	#main{
		width:100%;
		max-width:460px;
		padding:30px;
		text-align:center;

		background:var(--card-bg);
		border-radius:16px;
		box-shadow:0 10px 25px rgba(0,0,0,.4);
	}

	/* ==========================
	   TEXTOS
	========================== */

	h1{
		color:var(--primary-color);
		font-size:1.9rem;
		margin-bottom:15px;
	}

	.title2{
		color:var(--secondary-color);
	}

	#print{
		margin:12px 0;
		color:var(--primary-color);
		font-size:1.15rem;
		font-weight:600;
	}

	#ins,
	#choices{
		margin:10px 0;
		color:#cbd5e1;
		font-size:0.95rem;
		line-height:1.5;
	}

	/* ==========================
	   CONTROLES
	========================== */

	select,
	input[type="text"]{
		padding:6px;
		border:1px solid var(--border-color);
		border-radius:8px;
		background:var(--border-color);
		color:white;
	}

	#in_preencher,
	#in_bloquear,
	#in_rodadas{
		width:45px;
		text-align:center;
	}

	/* ==========================
	   BOTÕES
	========================== */

	button{
		min-width:70px;
		height:36px;

		border:none;
		border-radius:8px;

		background:var(--border-color);
		color:white;

		cursor:pointer;
		transition:.2s;
	}

	button:hover{
		background:var(--hover-color);
		transform:translateY(-1px);
	}

	/* botões tipo LOAD */

	.but_load{
		width:72px;
	}

	/* botões RESET */

	.but_reset{
		width:70px;
		background:var(--primary-color);
		color:#0f172a;
		font-weight:bold;
	}

	.but_reset:hover{
		background:#7dd3fc;
	}

	/* ==========================
	   LINHAS DE BOTÕES
	========================== */

	.toolbar{
		display:flex;
		justify-content:center;
		flex-wrap:wrap;
		gap:8px;
		margin:12px 0;
	}

	/* ==========================
	   TABULEIRO
	========================== */

	#b0,#b1,#b2,
	#b3,#b4,#b5,
	#b6,#b7,#b8{

		width:80px;
		height:80px;
		margin:2px;

		border:2px solid var(--border-color);
		border-radius:12px;

		background:var(--border-color);
		color:white;

		font-size:2rem;
		font-weight:bold;
		text-align:center;

		transition:.2s;
		cursor:pointer;
	}

	#b0:hover,#b1:hover,#b2:hover,
	#b3:hover,#b4:hover,#b5:hover,
	#b6:hover,#b7:hover,#b8:hover{
		background:var(--hover-color);
		transform:scale(1.03);
	}

	#board{
		display:grid;
		grid-template-columns:repeat(3,85px);
		gap:0px;

		justify-content:center;
		margin:15px auto;
	}

	/* casas bloqueadas */

	input:disabled{
		opacity:0.6;
		/*background:#000000;*/
	}

	/* ==========================
	   DIALOG
	========================== */

	dialog{
		position:fixed;

		top:30%;
		left:50%;

		transform:translate(-50%,-50%);

		min-width:320px;
		max-width:500px;

		padding:20px;

		background:#456789; /*var(--card-bg);*/
		color:white;

		border:3px solid #987654; /*var(--border-color);*/
		border-radius:12px;

		text-align:center;
	}

	dialog::backdrop{
		background:rgba(0,0,0,.65);
	}


	.winner{
		background:var(--accent-color) !important;
		border-color:#4ade80 !important;
		color:#0f172a !important;
		animation:pulse .6s infinite alternate;
	}

	@keyframes pulse{
		from{transform:scale(1);}
		to{transform:scale(1.08);}
	}


  </style>
</head>



<body>
	<div id="main">
		<h1>❌ Tic Tac Toe Expert ⭕</h1>
		<p class="title2">O Jogo da Velha como você nunca viu!</p>

		<!-- Game Instructions -->
		<p id="ins">Game starts by just tap on a box
			<br>
			First player starts as <b>X</b>	and second player as <b>O</b>

			<input type="button" id="b0" onclick="funcButton(0)">

			<input type="button" id="b5" onclick="funcButton(5)">

			<input type="button" id="b6" onclick="funcButton(6)">
			<input type="button" id="b7" onclick="funcButton(7)">
			<input type="button" id="b8" onclick="funcButton(8)">
		</div>
		
		<div class="toolbar">
		<button class="but_load" onclick="limpaEntradas()">Clear</button> 
		<button class="but_load" onclick="funcLuck()">Luck</button> 
		<button class="but_load" onclick="funcLoad()">Load</button> 
		<button class="but_load" onclick="NovoJogo()">New</button> 
		</div>
		<div class="toolbar">
		<button class="but_load" onclick="funcPlayRandom()">Rand</button>
		<button class="but_load" onclick="chamaJogadaPC()">Xprt</button>
		<button class="but_load" onclick="funcPlayAllRandom()">All</button>
		<button class="but_load" onclick="funcBloqueia()">Bloq</button>
		</div>
		
		<p id="choices" style="font-size:90%;">
		Fill: <input type="text" id="in_preencher" size=2 value=2> &emsp; 
		Bloq: <input type="text" id="in_bloquear" size=2 value=2> &emsp; 
		Rnds: <input type="text" id="in_rodadas" size=2 value=4>
		</p>
		
		<p id="choices">
		PC:<input type="checkbox" id="checkPCmode" onclick="funcPCPlayerClick()" checked> &emsp; 
		as X:<input type="checkbox" id="checkPCplayer" onclick="funcPCPlayerClick()" checked> &emsp; 
		level:
		<select id="choiceLevel">
			<option value="0">0 - Easy</option>
			<option value="1">1 - Piece of cake</option>
			<option value="2" selected>2 - Expert</option>
			<option value="3">3 - Daniel San</option>
			<option value="4">4 - Miyagi</option>
			<option value="5">5 - Ninja</option>
			<option value="6">6 - Luke Skywalker</option>
			<option value="7">7 - Jedi</option>
			<option value="8">8 - Yoda</option -->
			<option value="9">9 - Darth Vader</option -->
		</select>
		</p>
		
		<div class="toolbar">
		<!-- Button to reset game -->
		<button class="but_load" onclick="funcBack()"><</button>
		<button class="but_load" onclick="funcReset()">RESET</button>
		<button class="but_load" onclick="funcHelp()">?</button>
		</div>
		
		<!-- Instructions for the Function of Buttons -->
		<dialog id="HelpDialog"></dialog>
		<dialog id="GameOver"></dialog>
	</div>
	







<script type="text/javascript">


// Here onwards, functions check turn of the player and put accordingly value X or O
var flagXO = 'X';
//var b0, b1, b2, b3, b4, b5, b6, b7, b8;

var counterTurns = 0;
var counterGames = 0;
var counterXWins = 0;
var counterOWins = 0;
var counterTies  = 0;

var lista_resultados = [];
var jogoatual = '';

var fullboxes = 0;
var bloqboxes = 0;
var bloqrounds = 0;

function funcHelp() {
	var message = "Functions of each button:<br>";
	
	message += "<p  style='text-align:left'>"; //; width: 260px
	message += "Button <b>Clear</b>: clear the entrie values<br>";
	message += "Button <b>Luck</b>: sort values for each entrie<br>";
	message += "Button <b>Load</b>: load boxes like entries<br>";
	message += "Button <b>New</b>: prepare a new game<br>";
	message += "Button <b>Rand</b>: randomic play<br>";
	message += "Button <b>Xprt</b>: play like the pc mode<br>";
	message += "Button <b>All</b>: fill all box<br>";
	message += "Button <b>Bloq</b>: block choosed boxes<br><br>";
	message += "</p>";

	message += "<p  style='text-align:center'>";
	message += "<button class='but_load' onclick='closeHelp()'>Close</button><br>";
	message += "</p>";

	document.getElementById('HelpDialog').innerHTML = message;

	var x = document.getElementById("HelpDialog"); 
	x.show(); 
}

// Closes the dialog after the time setted
function closeHelp() { 
	var x = document.getElementById("HelpDialog"); 
	x.close(); 
}

function funcBack() {
	var ultimacasa = jogoatual.slice(jogoatual.length-1, jogoatual.length);
	jogoatual = jogoatual.slice(0, jogoatual.length-1);
	//alert("funcBack() [jogoatual: " + jogoatual + " [ultimacasa: " + ultimacasa);
	document.getElementById('b'+ultimacasa).value = "";
	document.getElementById('b'+ultimacasa).disabled = false;
	if (flagXO == 'X') flagXO = 'O';
	else flagXO = 'X';
	counterTurns--;

	funcChangeBoxColor(0, ultimacasa);

	funcCheckWinner();
}

function funcButton(but) {
	jogoatual += '' + but;
	document.getElementById('b'+but).value = flagXO;
	document.getElementById('b'+but).disabled = true;
	if (flagXO == 'X') flagXO = 'O';
	else flagXO = 'X';
	counterTurns++;
	if (counterTurns >= bloqrounds) setFreeTheEmptyBoxes();

	funcChangeBoxColor(counterTurns, but);

	funcCheckWinner();
}


// Function called whenever user tab on any box
function funcCheckWinner() {

	// ***  Usar as funções novas de teste de fim de jogo e retorno do resultado, passando a string do jogo, ou até mesmo lendo os valores atuais e montando string ou vetor.
	
	var resultado = ConsultaResultado(jogoatual);
	
	// Checking if Player X won. If so, disable all the other fields
	if (resultado == "X ganhou!") {
		ShowWinner('X');
		funcDisableBoxes();
		counterGames++;
		counterXWins++;
	}

	// Checking if Player O won. If so, disable all the other fields
	else if (resultado == "O ganhou!") {
		ShowWinner('O');
		funcDisableBoxes();
		counterGames++;
		counterOWins++;
	}


	// Here, Checking about Tie
	else if (resultado == "Deu velha!") {
		ShowWinner("tie");
		counterGames++;
		counterTies++;
	}
	
	// If the match does not finished, shows who is the next player
	else {
		document.getElementById('print').innerHTML = "Player <b>" + flagXO + "</b> turn (" + counterTurns + ")";
		if (funcPCmodeOn() && funcPCPlayer() == flagXO) chamaJogadaPC();
	}
	
	atualizaPlacar();
}



/*

Entradas:
- Nº de casas a serem preenchidas
- Nº de casas a serem bloqueadas
- Nº de rodadas a ficarem bloqueadas


Opçao 1
Sorteia quantas casas serão preenchidas
Sorteia o num de cada casa a ser preenchida 
Antes de preencher, tem que testar se não vai acabar a partida
Preencher e passar para a prox a ser preenchida


Opçao 2
Sorteia alguma casa para não ser preenchida nas primeiras X rodadas


Opçao 3
Escolher as casas a serem bloqueadas (e nº de rodadas)


Desafio 1
Computador nivel facil: marcaçoes aleatorias

Desafio 2
Computador nivel dificil: marcaçoes para tornar o mais dificil possivel a vitoria do jogador

Desafio 3
Criar cenários iniciais que sejam interessantes

*/



function funcLoad(){
	
	limpaJogo();
	
	var pcmodetemp = funcPCmodeOn();
	document.getElementById('checkPCmode').checked = false;

	fullboxes  = Number(document.getElementById('in_preencher').value);
	bloqboxes  = Number(document.getElementById('in_bloquear').value);
	bloqrounds = Number(document.getElementById('in_rodadas').value);

	if (fullboxes > 4) fullboxes = 4;
	if (bloqboxes > 6) bloqboxes = 6;
	if ( (fullboxes + bloqboxes > 6) && (bloqboxes > 0) ) bloqboxes = 6 - fullboxes;
	if (bloqboxes > 0  &&  bloqrounds == 0) bloqrounds = 1;
	if (bloqrounds > 8 - fullboxes - bloqboxes ) bloqrounds = 8 - fullboxes - bloqboxes;

	document.getElementById('in_preencher').value = fullboxes;
	document.getElementById('in_bloquear').value = bloqboxes;
	document.getElementById('in_rodadas').value = bloqrounds;
	
	bloqrounds = bloqrounds + fullboxes;

	funcLoadBoxes(fullboxes);
	funcBloqBoxes(bloqboxes);

	document.getElementById('checkPCmode').checked = pcmodetemp;
	if (pcmodetemp && funcPCPlayer() == flagXO) chamaJogadaPC();
}

function funcLuck(){
	//if (!fullboxes) 
		document.getElementById('in_preencher').value = funcRandom0to(5);
	//if (!bloqboxes) 
		document.getElementById('in_bloquear').value = funcRandom0to(5);
	//if (!bloqrounds) 
		document.getElementById('in_rodadas').value = funcRandom0to(5);

	funcLoad();
}

// Function to genarate a number beetween 0 and max-1
function funcRandom0to(max){
	var num = Math.random();
	return Math.trunc(num*max);
}

function funcPlayRandom(){
	if (countFreeBoxes() == 0) limpaJogo();
	funcFillBoxes(1);
}

function funcPlayAllRandom(){
	limpaJogo();
	// turnOffPCmode:
	document.getElementById('checkPCmode').checked = false;
	funcFillBoxes(9);
}

function NovoJogo(){
	limpaJogo();
	funcPCPlayerClick();
}

function limpaJogo(){
	counterTurns = 0;
	bloqrounds = 0;
	jogoatual = '';
	flagXO = 'X';
	var i = 0;
	while (i < 9) {
		document.getElementById("b"+i).value = "";
		document.getElementById("b"+i).disabled = false;
		funcChangeBoxColor(0, i);
		document.getElementById("b"+i).classList.remove("winner");
		i++;
	}
	document.getElementById('print').innerHTML = "Player <b>X</b> turn (" + counterTurns + ")";
}

function funcBloqueia(){
	var i = 0;
	while (i < 9) {
		document.getElementById("b"+i).value = "";
		funcChangeBoxColor(0, i);
		i++;
	}
	counterTurns = 0;
	jogoatual = '';
	bloqrounds = Number(document.getElementById('in_rodadas').value);
	flagXO = 'X';
	document.getElementById('print').innerHTML = "Player <b>X</b> turn (" + counterTurns + ")";
}

function funcFillBoxes(n){
	var i = 0;
	var boxnum = 0;
	while ( (i < n) && (countFreeBoxes() > 0) ) {
		boxnum = funcRandom0to(9);
		if (testFreeBox(boxnum)) {
			funcButton(boxnum);
			i++;
		}
	}
}

function funcLoadBoxes(n){
	var i = 0;
	var boxnum = 0;
	while ( (counterTurns < n) && (countFreeBoxes() > 0) ) {
		boxnum = funcRandom0to(9);
		if (testFreeBox(boxnum)) {
			funcButton(boxnum);
			i++;
		}
	}
}


function testFreeBox(i){
	return ( !document.getElementById("b"+i).disabled  &&  !Boolean(document.getElementById("b"+i).value) );
}


function funcBloqBoxes(n){
	var i = 0;
	var boxnum = 0;
	while ( (i < n) && (countFreeBoxes() > 0) ) {
		boxnum = funcRandom0to(9);
		if (testFreeBox(boxnum)) {
			funcBloqBox(boxnum);
			i++;
		}
	}
}

function funcBloqBox(i){
	if (testFreeBox(i)) {
		document.getElementById("b"+i).disabled = true;
		return true;
	}
	else return false;
}

function countEmptyBoxes(){
	var i = 0;
	var counter = 0;
	while (i < 9) {
		if (!document.getElementById("b"+i).value) counter++;
		i++;
	}
	return counter;
}

function countFreeBoxes(){
	var i = 0;
	var counter = 0;
	while (i < 9) {
		if (!document.getElementById("b"+i).disabled) counter++;
		i++;
	}
	return counter;
}

function limpaEntradas() {
	fullboxes = 0;
	bloqboxes = 0;
	bloqrounds = 0;
	document.getElementById("in_preencher").value = "";
	document.getElementById("in_bloquear").value = "";
	document.getElementById("in_rodadas").value = "";
}

function setFreeTheEmptyBoxes(){
	var i = 0;
	while (i < 9) {
		if (document.getElementById("b"+i).value == "")
			document.getElementById("b"+i).disabled = false;
		i++;
	}
}


function funcPCmodeOn(){
	return document.getElementById("checkPCmode").checked;
}

function funcPCPlayer(){
	if (document.getElementById("checkPCplayer").checked) return "X";
	else return "O";
}

function funcPCPlayerClick(){
	//alert('PC player: ' + 	funcPCPlayer() + '; and flag: ' + flagXO);
	if (funcPCmodeOn() && funcPCPlayer() == flagXO) chamaJogadaPC(); //funcFillBoxes(1);
}





// Function to show who is the winner
function ShowWinner( winner ){
	var message = "";
	
	if (winner == 'tie') message = "Match Tie!";
	else {
		destacaVencedor(LinhaVencedora(jogoatual));
		message = "Player " + winner + " won!!!<br>";
	}
	document.getElementById('print').innerHTML = message;
	document.getElementById('GameOver').innerHTML = message;

	var x = document.getElementById("GameOver"); 
	x.show(); 
	setTimeout(closeDialog, 1500); 
}

// Closes the dialog after the time setted
function closeDialog() { 
	var x = document.getElementById("GameOver"); 
	x.close(); 
}





// Function to disable the boxes when the game is finished
function funcDisableBoxes() {
	document.getElementById("b0").disabled = true;
	document.getElementById("b1").disabled = true;
	document.getElementById("b2").disabled = true;
	document.getElementById("b3").disabled = true;
	document.getElementById("b4").disabled = true;
	document.getElementById("b5").disabled = true;
	document.getElementById("b6").disabled = true;
	document.getElementById("b7").disabled = true;
	document.getElementById("b8").disabled = true;
	//alert('Disabled');
}



// Function to reset game
function funcReset() {
	location.reload();
}



function atualizaPlacar(){
    var painel = `
    <table style="
        margin:0 auto;
        border-collapse:separate;
        border-spacing:30px 0px;
        text-align:right;
    ">
        <tr>
            <td>Matches <b>played</b> = <b>${counterGames}</b></td>
            <td>Matches won by <b>X</b> = <b>${counterXWins}</b></td>
        </tr>

        <tr>
            <td>Matches <b>tied</b> = <b>${counterTies}</b></td>
            <td>Matches won by <b>O</b> = <b>${counterOWins}</b></td>
        </tr>
    </table>
    `;
    document.getElementById('ins').innerHTML = painel;
}




function funcChangeBoxColorOld(turn, but){
//		border: 1px solid red;
//		"property:value;"
	var estilo = [];
	estilo[0] = "width: 80px; height: 52px; margin: auto; border: 2px solid gray; border-radius: 6px; font-size: 30px; text-align: center;";
	estilo[1] = "width: 80px; height: 52px; margin: auto; border: 2px solid red; border-radius: 6px; font-size: 30px; text-align: center;";
	estilo[2] = "width: 80px; height: 52px; margin: auto; border: 2px solid orange; border-radius: 6px; font-size: 30px; text-align: center;";
	estilo[3] = "width: 80px; height: 52px; margin: auto; border: 2px solid gold; border-radius: 6px; font-size: 30px; text-align: center;";
	if (turn < 4) document.getElementById('b'+but).style = estilo[turn];

}


function funcChangeBoxColor(turn, but){
    const el = document.getElementById('b'+but);

    el.style.borderColor =
        turn === 1 ? '#ef4444' :
        turn === 2 ? '#f97316' :
        turn === 3 ? '#facc15' :
        'var(--border-color)';
}


// ==================================== Bloco de funções para Jogadas modo PC ====================================


function pcLevel(level){
	return (level == document.getElementById('choiceLevel').value);
}

function chamaJogadaPC(){
	if (countFreeBoxes() == 0) limpaJogo();
	switch (document.getElementById('choiceLevel').value) {
		case '0':
			setTimeout(funcPlayEasy, 200);
			break;
		case '1':
			setTimeout(funcPlayCake, 200);
			break;
		case '2':
			setTimeout(funcPlayVanDaime, 200);
			break;
		case '3':
			setTimeout(funcPlayCobra, 200);
			break;
		case '4':
			setTimeout(funcPlayDaniSan, 200);
			break;
		case '5':
			setTimeout(funcPlayExpert, 200);
			break;
		case '6':
			setTimeout(funcPlayYoda, 200);
			break;
		case '7':
			setTimeout(funcPlayYoda, 200);
			break;
		case '8':
			setTimeout(funcPlayYoda, 200);
			break;
		case '9':
			setTimeout(funcPlayYoda, 200);
			break;
		default:
			null;
	}
}

function funcPlayEasy(){
	funcFillBoxes(1);
}

function funcPlayCake(){
	if (testFreeBox(4) && ( AvaliaCasa(jogoatual, 4, 1, 3, 1) || AvaliaCasa(jogoatual, 4, -1, 3, 1) )) funcButton(4);
	else funcFillBoxes(1);
}

function funcPlayVanDaime(){
	var flag = Math.pow(-1, (jogoatual.length) );
	var consulta = "";
	var i = 0;
	while (i < 9) {
		if ( testFreeBox(i) &&  AvaliaCasa(jogoatual, i, flag, 3, 1) )	{
			funcButton(i);
			consulta = "sai";
			break;
		}
		i++;
	}
	
	if (consulta == "") {

function AvaliaCasa(jogo, num, flag, score, minimo) {

	if (flag*(vetor[6]+vetor[7]+vetor[8]) == score) teste++;

	if (flag*(vetor[2]+vetor[5]+vetor[8]) == score) teste++;
	if (flag*(vetor[0]+vetor[4]+vetor[8]) == score) teste++;
	if (flag*(vetor[2]+vetor[4]+vetor[6]) == score) teste++;

// Recebe jogo no formato "012345678"
function CarregaJogadas(jogo){
	var vetor = [0,0,0, 0,0,0, 0,0,0];
	var i = 0;
	while (i < jogo.length) {
		vetor[jogo[i]] = Math.pow(-1, i);
		i++;
	}
	return vetor;
}

function JogadorDaVez(jogo){
	var flag = Math.pow(-1, (jogo.length) );
	if (flag == 1) return "X";
	else return "O";

	return (  jogo.length == 9  ||  AvaliaCasa(jogo, -1,  1, 3, 1)  ||  AvaliaCasa(jogo, -1, -1, 3, 1)  );
}

	else

	else return "Deu velha!";

					if (lista_gTie[k] != lista_winX[i]) filtro_gTie.push(lista_gTie[k]);
					k++;
				}
				
				i++;
				lista_winO = filtro_winO;
				lista_gTie = filtro_gTie;
				filtro_winO = [];
				filtro_gTie = [];
			}
		}

		//alert("MelhoresJogadas2222 (aO)\n - Lista X win: " + lista_winX + "\n - Lista O win: " + lista_winO + "\n - Lista deu velha: " + lista_gTie); 

		if (lista_winO.length) melhor = ChooseBestFreeBox(lista_winO, []);
		
		if (melhor == '' && lista_gTie.length) melhor = ChooseBestFreeBox(lista_gTie, []);
		
		//alert("MelhoresJogadas2222 (aO)\n - Lista X win: " + lista_winX + "\n - Lista O win: " + lista_winO + "\n - Lista deu velha: " + lista_gTie + "\n - Melhor escolhido: " + melhor); 

		if (melhor  == '') melhor = AvaliaCasasLivres(jogoatual, -1);
	}
	
	//alert("MelhoresJogadas2222 (a1)\n - Lista X win: " + lista_winX + "\n - Lista O win: " + lista_winO + "\n - Lista deu velha: " + lista_gTie + "\n - Melhor escolhido: " + melhor); 
	
	//alert("MelhoresJogadas2222 (a2)\n - Jogo atual: " + jogoatual + "\n - Flag: " + flagXO + "\n - Melhor escolhido: " + melhor); 
	
	return melhor;
}


/// fazer ajustes aqui para modos de escolha diferentes e também na chamada da função (diferenciar Yoda e Darth)
function ChooseBestFreeBox(vet1, vet2) {
	var best = '';
	var vetor = vet1.concat(vet2);
	for (let i = 0; i < vetor.length; i++) {
		if (testFreeBox(Number(vetor[i]))) best += Number(vetor[i]);
	}
	if (best.length) return best[ funcRandom0to(best.length) ];
	else return '';
}


function AvaliaCasasLivres(jogo, flag) {
	var best = '';
	for (let i = 0; i < 9; i++) {
		if (testFreeBox(i)) {
			if (AvaliaCasa(jogo, i, -flag, 3, 1)) best  = ''+i;
			else
			if (AvaliaCasa(jogo, i,  flag, 2, 2)) best += i;
		}
	}

	if (best == '') {
		for (let i = 0; i < 9; i++) {
			if (testFreeBox(i)) {
				if (AvaliaCasa(jogo, i, -flag, 2, 2)) best = ''+i;
				else
				if (AvaliaCasa(jogo, i,  flag, 2, 1)) best += i;
			}
		}
	}

	if (best.length) return best[0];
	else return '';
}













function MelhoresJogadasFiltradas(rodada, jogador){
	var lista_winX = [];

	var lista_gTie = [];

	var i = 0;
	while (i < lista_resultados.length) {

	var filtro_winO = [];
	var filtro_gTie = [];

					//if (lista_gTie[k] != lista_winO[i]) filtro_gTie.push(lista_gTie[k]);
					k++;
				}
				
				i++;
				lista_winX = filtro_winX;
				lista_gTie = filtro_gTie;
				filtro_winX = [];
				filtro_gTie = [];
			}
		}

		if (lista_winX.length) melhor = ChooseBestFreeBox(lista_winX, []);
		
		if (melhor == '' && lista_gTie.length) melhor = ChooseBestFreeBox(lista_gTie, []);
		
		if (melhor  == '') melhor = AvaliaCasasLivres(jogoatual, 1);
	}

	if (jogador == 'O'){
		// Se as outras listas contem o item da lista_winX, retira esse item das outras listas
		if (lista_winX.length > 0) {
			i = 0;
			while (i < lista_winX.length) {
				k = 0;
				while (k < lista_winO.length) {
					if (lista_winO[k] != lista_winX[i]) filtro_winO.push(lista_winO[k]);
					k++;
				}

				k = 0;
				while (k < lista_gTie.length) {
					if (lista_gTie[k] != lista_winX[i]) filtro_gTie.push(lista_gTie[k]);
					k++;
				}
				
				i++;
				lista_winO = filtro_winO;
				lista_gTie = filtro_gTie;
				filtro_winO = [];
				filtro_gTie = [];
			}
		}

		if (lista_winO.length) melhor = ChooseBestFreeBox(lista_winO, []);
		
		if (melhor == '' && lista_gTie.length) melhor = ChooseBestFreeBox(lista_gTie, []);
		
		if (melhor  == '') melhor = AvaliaCasasLivres(jogoatual, -1);
	}
	
	//alert("MelhoresJogadasFiltradas\n - Lista X win: " + lista_winX + "\n - Lista O win: " + lista_winO + "\n - Lista deu velha: " + lista_gTie + "\n - Melhor escolhido: " + melhor);
	
	return melhor;
}

function LinhaVencedora(jogo){

    const v = CarregaJogadas(jogo);

    const linhas = [
        [0,1,2],
        [3,4,5],
        [6,7,8],
        [0,3,6],
        [1,4,7],
        [2,5,8],
        [0,4,8],
        [2,4,6]
    ];

    for(let l of linhas){

        let soma =
            v[l[0]] +
            v[l[1]] +
            v[l[2]];

        if(Math.abs(soma) === 3)
            return l;
    }

    return null;
}
